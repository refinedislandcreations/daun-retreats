[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"
  NODE_VERSION = "20"

[[redirects]]
  from = "/booking"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/booking/"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/book-now"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/book-now/"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

[[redirects]]
  from = "/explore-the-area"
  to = "/explore-the-area.html"
  status = 301

[[redirects]]
  from = "/gerimis-senja-villa"
  to = "/gerimis-senja-villa.html"
  status = 301

[[redirects]]
  from = "/kozu-villa"
  to = "/kozu-villa.html"
  status = 301

[[redirects]]
  from = "/kasturi-cabin"
  to = "/kasturi-cabin.html"
  status = 301

[[redirects]]
  from = "/heritage-kampung-home"
  to = "/heritage-kampung-home.html"
  status = 301

[[redirects]]
  from = "/norehans-place"
  to = "/norehans-place.html"
  status = 301

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 301

[[redirects]]
  from = "/return-and-refund-policy"
  to = "/return-and-refund-policy.html"
  status = 301

[[redirects]]
  from = "/terms-and-conditions"
  to = "/terms-and-conditions.html"
  status = 301

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"