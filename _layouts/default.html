<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="icon"
      href="{{ '/assets/images/icons/daun-retreats-logo.png' | relative_url }}?v={{ site.time | date: '%s' }}"
      sizes="any"
    />
    <link
      rel="apple-touch-icon"
      href="{{ '/assets/images/icons/daun-retreats-logo.png' | relative_url }}?v={{ site.time | date: '%s' }}"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Proza+Libre:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Proza+Libre:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Proza+Libre:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap"
      />
    </noscript>

    {% if page.hero.slides[0].image %}
    <link rel="preload" as="image" href="{{ page.hero.slides[0].image | relative_url }}" fetchpriority="high">
    {% endif %}

    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    ></script>
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"
    ></script>
    <script
      defer
      src="https://assets.codepen.io/16327/SplitText.min.js"
    ></script>

    <!-- Tailwind Build CSS-->
    <style>
      {% include output.css %}
    </style>

    <!-- Custom Styles -->
    <style>
      {% include style.css %}
    </style>


    {% include site-seo.html %}
  </head>
  <body>
    {% include site-header.html %}
    <main>{{ content }}</main>
    {% include site-footer.html %}

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (typeof gsap === "undefined" || typeof SplitText === "undefined") {
          console.log("GSAP or SplitText not loaded yet");
          return;
        }

        document.fonts.ready.then(() => {
          const animateTitles = document.querySelectorAll(".animate-title");

          animateTitles.forEach((title) => {
            if (title) {
              gsap.set(title, { opacity: 1 });

              SplitText.create(title, {
                type: "words,lines",
                linesClass: "line",
                autoSplit: true,
                mask: "lines",
                onSplit: (self) => {
                  gsap.from(self.lines, {
                    scrollTrigger: {
                      trigger: title,
                      start: "top 80%",
                      toggleActions: "play reverse play reverse",
                    },
                    duration: 1.2,
                    yPercent: 100,
                    opacity: 0,
                    stagger: 0.1,
                    ease: "power2.out",
                  });
                },
              });
            }
          });
          ScrollTrigger.refresh();
        });
      });
    </script>
  </body>
</html>
