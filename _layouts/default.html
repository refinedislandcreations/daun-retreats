<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="icon"
      href="{{ '/assets/images/icons/daun-retreats-logo.png' | relative_url }}?v={{ site.time | date: '%s' }}"
      sizes="any"
    />
    <link
      rel="apple-touch-icon"
      href="{{ '/assets/images/icons/daun-retreats-logo.png' | relative_url }}?v={{ site.time | date: '%s' }}"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://assets.codepen.io" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Proza+Libre:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />

    {% if page.hero.slides[0].image %}
    <link rel="preload" as="image" href="{{ page.hero.slides[0].image | relative_url }}" fetchpriority="high">
    {% endif %}

    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    ></script>
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"
    ></script>
    <script
      defer
      src="https://assets.codepen.io/16327/SplitText.min.js"
    ></script>
    <script defer src="https://unpkg.com/split-type"></script>

    <!-- Tailwind Build CSS-->
    <link
      rel="stylesheet"
      href="{{ '/assets/css/output.css' | relative_url }}?v={{ site.time | date: '%s' }}"
    />

    <!-- Custom Styles -->
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}"
    />

    {% include site-seo.html %}
  </head>
  <body>
    {% include site-header.html %}
    <main>{{ content }}</main>
    {% include site-footer.html %}
  </body>
</html>
