<!-- _includes/section-hero.html -->
<section
  class="relative w-full min-h-screen overflow-hidden bg-[#FBF8EF] flex justify-center pt-[68px] md:pt-[80px]"
>
  <div class="relative w-full h-full max-w-screen-2xl">
    <div class="hidden md:flex flex-col w-full h-full">
      <div class="relative" style="height: 80vh">
        <div class="absolute inset-0 flex justify-start">
          <div
            class="relative w-full md:w-[70%] lg:w-[65%] h-full md:ml-6 lg:ml-12 xl:ml-16"
          >
            {% for slide in include.section.slides %}
            <div
              class="hero-slide absolute inset-0 transition-opacity duration-700 ease-in-out {% if forloop.first %}opacity-100{% else %}opacity-0{% endif %}"
            >
              <img
                src="{{ slide.image }}"
                alt="{{ include.section.title }}"
                class="w-full h-full object-cover"
                loading="lazy"
              />
              <div class="absolute inset-0 bg-black/25"></div>
            </div>
            {% endfor %}
          </div>
        </div>

        <div
          class="absolute inset-0 z-10 flex items-center px-4 sm:px-6 md:px-8 lg:px-12 justify-center md:justify-end pointer-events-none"
        >
          <div
            class="relative bg-[#FBF8EF]/80 rounded-2xl px-8 sm:px-10 md:px-12 lg:px-16 xl:px-20 py-10 sm:py-12 md:py-14 lg:py-16 xl:py-20 text-center md:text-right mx-4 sm:mx-6 md:mx-0 inline-block pointer-events-auto"
          >
            {% if include.section.button_text %}
            <a
              href="{{ include.section.button_link | default: '#' }}"
              class="absolute -bottom-5 right-4 sm:right-6 md:right-8 lg:right-10 z-20 bg-[#005509] hover:bg-[#006611] text-[#FBF8EF] px-6 sm:px-7 md:px-8 lg:px-10 py-2.5 sm:py-3 lg:py-4 rounded-lg font-medium transition-all duration-300 shadow-lg hover:shadow-xl border-2 border-transparent hover:border-[#FBF8EF]/20 tracking-wide proza-libre text-sm sm:text-base"
            >
              {{ include.section.button_text }}
            </a>
            {% endif %}

            <!-- Hero Title -->
            <h1
              class="hero-split tracking-wide text-[clamp(2.2rem,7vw,6rem)] sm:text-[clamp(2.5rem,6.5vw,6.5rem)] md:text-[clamp(3rem,5vw,7rem)] lg:text-[clamp(3.5rem,4.5vw,7.5rem)] xl:text-[clamp(4rem,4vw,8rem)] text-[#000] mb-2 md:mb-0 leading-[1.1] cormorant-garamond"
            >
              {{ include.section.title }}
            </h1>

            <!-- Hero Subtitle -->
            <p
              class="hero-split-sub font-sans text-[clamp(0.9rem,2.5vw,1.2rem)] sm:text-[clamp(1rem,2vw,1.4rem)] md:text-[clamp(1.05rem,1.8vw,1.5rem)] lg:text-[clamp(1.1rem,1.6vw,1.6rem)] text-[#000]/80 leading-relaxed max-w-3xl mx-auto md:mx-0 md:ml-auto mb-2 md:mb-0 proza-libre"
            >
              {{ include.section.subtitle }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- GSAP + SplitText Hero Animation -->
<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/SplitText.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.fonts.ready.then(() => {
      // Title Animation
      const splitTitle = new SplitText(".hero-split", {
        type: "words,lines",
        linesClass: "line",
        mask: "lines",
      });
      gsap.set(".hero-split", { opacity: 1 });
      gsap.from(splitTitle.lines, {
        duration: 0.8,
        yPercent: 100,
        opacity: 0,
        stagger: 0.15,
        ease: "expo.out",
      });

      // Subtitle Animation
      const splitSub = new SplitText(".hero-split-sub", {
        type: "words",
        wordsClass: "word",
      });
      gsap.set(".hero-split-sub", { opacity: 1 });
      gsap.from(splitSub.words, {
        duration: 0.6,
        y: 20,
        opacity: 0,
        stagger: 0.03,
        ease: "expo.out",
      });
    });
  });
</script>

<style>
  .hero-split,
  .hero-split-sub {
    opacity: 0;
    will-change: transform;
  }

  .hero-split .line {
    display: block;
    overflow: visible; /* Fixed: ensure text is visible */
  }

  .hero-split-sub .word {
    display: inline-block;
    will-change: transform;
  }
</style>
