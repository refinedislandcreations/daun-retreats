<!-- _includes/section-property-carousel.html -->

<section class="py-28 bg-[#E9E6DC] overflow-hidden">
  <div class="max-w-screen-2xl mx-auto px-6">
    <!-- Title -->
    <div class="text-center max-w-4xl mx-auto mb-16">
      <h2
        class="font-serif text-5xl md:text-6xl tracking-[0.15em] mb-8 opacity-0 translate-y-8"
        id="sectionTitle"
      >
        {{ include.section.title }}
      </h2>

      <p
        class="text-lg text-neutral-700 leading-relaxed opacity-0 translate-y-8"
        id="sectionDescription"
      >
        {{ include.section.description }}
      </p>
    </div>

    <!-- Slider -->
    <div class="relative overflow-hidden">
      <div id="bedroomTrack" class="flex gap-4 md:gap-6 items-center">
        {% for slide in include.section.slides %}
        <div
          class="w-[75%] sm:w-[60%] md:w-[32%] lg:w-[28%] flex-shrink-0 overflow-hidden group transition-all duration-500"
        >
          <div class="overflow-hidden">
            <img
              src="{{ slide.image }}"
              class="w-full h-[400px] object-cover transition-transform duration-700"
              alt=""
            />
          </div>
        </div>
        {% endfor %}
      </div>
    </div>

    <!-- Caption + Arrows -->
    <div class="flex items-center justify-between mt-12">
      <button
        id="prevBtn"
        class="text-4xl w-12 h-12 flex items-center justify-center text-[#005509] opacity-0 scale-75"
        aria-label="Previous slide"
      >
        ‹
      </button>

      <div class="flex items-center gap-6">
        <div
          class="caption-line w-24 h-[2px] bg-green-700 scale-x-50 opacity-0 origin-left"
        ></div>
        <span id="captionText" class="text-lg opacity-0">
          {{ include.section.slides[1].caption }}
        </span>
      </div>

      <button
        id="nextBtn"
        class="text-4xl w-12 h-12 flex items-center justify-center text-[#005509] opacity-0 scale-75"
        aria-label="Next slide"
      >
        ›
      </button>
    </div>

    <!-- CTA -->
    <div class="flex justify-end mt-8">
      <a
        href="{{ include.section.button.url }}"
        class="bg-green-800 text-white px-8 py-4 rounded-lg hover:opacity-90 transition-all duration-300 hover:shadow-lg hover:scale-105 opacity-0 scale-90"
        id="bookNowBtn"
      >
        {{ include.section.button.label }}
      </a>
    </div>
  </div>
</section>

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {

    const track = document.getElementById("bedroomTrack");
    const slides = Array.from(track.children);
    const caption = document.getElementById("captionText");
    const captions = {{ include.section.slides | map: "caption" | jsonify }};
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let index = 1;
    let isAnimating = false;

    function getGap() {
      const style = window.getComputedStyle(track);
      return parseFloat(style.columnGap || style.gap || 0);
    }

    function updateSlider(animate = true) {
      if (isAnimating) return;
      isAnimating = true;

      const gap = getGap();
      const containerWidth = track.parentElement.offsetWidth;

      const slideWidth = slides[index].offsetWidth;
      const scaleFactor = 1.1;

      const centerOffset =
        (containerWidth / 2) - ((slideWidth * scaleFactor) / 2);

      const slidePosition = slides[index].offsetLeft;

      const translateX = slidePosition - centerOffset;

      gsap.to(track, {
        x: -translateX,
        duration: animate ? 0.8 : 0,
        ease: "power3.inOut",
        onComplete: () => isAnimating = false
      });

      slides.forEach((slide, i) => {
        if (i === index) {
          gsap.to(slide, {
            scale: 1,
            opacity: 1,
            duration: 0.6,
            ease: "power2.out"
          });
        } else {
          gsap.to(slide, {
            scale: 1,
            opacity: 0.6,
            duration: 0.6,
            ease: "power2.out"
          });
        }
      });

      gsap.to(caption, {
        opacity: 0,
        duration: 0.3,
        onComplete: () => {
          caption.textContent = captions[index];
          gsap.to(caption, { opacity: 1, duration: 0.5 });
        }
      });

      gsap.fromTo(".caption-line",
        { scaleX: 0.3, opacity: 0.5 },
        { scaleX: 1, opacity: 1, duration: 0.6, ease: "power2.out" }
      );
    }

    function nextSlide() {
      if (isAnimating) return;
      index = (index + 1) % slides.length;
      updateSlider();
    }

    function prevSlide() {
      if (isAnimating) return;
      index = (index - 1 + slides.length) % slides.length;
      updateSlider();
    }

    nextBtn.addEventListener("click", nextSlide);
    prevBtn.addEventListener("click", prevSlide);

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
    });

    // Touch support
    let touchStartX = 0;
    track.addEventListener("touchstart", e => {
      touchStartX = e.changedTouches[0].screenX;
    });

    track.addEventListener("touchend", e => {
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (diff > 50) nextSlide();
      if (diff < -50) prevSlide();
    });

    // Resize fix
    window.addEventListener("resize", () => {
      updateSlider(false);
    });

    // Initial animation timeline
    const tl = gsap.timeline();

    tl.to("#sectionTitle", {
      opacity: 1,
      y: 0,
      duration: 1,
      ease: "power3.out"
    })
    .to("#sectionDescription", {
      opacity: 1,
      y: 0,
      duration: 1,
      ease: "power3.out"
    }, "-=0.8")
    .to("#prevBtn, #nextBtn", {
      opacity: 1,
      scale: 1,
      duration: 0.8,
      stagger: 0.2,
      ease: "back.out(1.7)"
    }, "-=0.5")
    .to(".caption-line", {
      opacity: 1,
      scaleX: 1,
      duration: 0.8,
      ease: "power2.out"
    }, "-=0.3")
    .to("#captionText", {
      opacity: 1,
      duration: 0.8
    }, "-=0.6")
    .to("#bookNowBtn", {
      opacity: 1,
      scale: 1,
      duration: 0.8,
      ease: "back.out(1.7)"
    }, "-=0.4");

    // Initialize
    setTimeout(() => updateSlider(false), 100);

  });
</script>
