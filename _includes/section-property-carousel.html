<!-- _includes/section-property-carousel.html -->

<section class="py-28 bg-[#E9E6DC] overflow-hidden">
  <div class="max-w-screen-2xl mx-auto px-6">
    <!-- Title with GSAP animation -->
    <div class="text-center max-w-4xl mx-auto mb-16">
      <h2
        class="font-serif text-5xl md:text-6xl tracking-[0.15em] mb-8 opacity-0"
        id="sectionTitle"
      >
        {{ include.section.title }}
      </h2>

      <p
        class="text-lg text-neutral-700 leading-relaxed opacity-0"
        id="sectionDescription"
      >
        {{ include.section.description }}
      </p>
    </div>

    <!-- Slider Wrapper with smaller images -->
    <div class="relative">
      <!-- Track -->
      <div
        id="bedroomTrack"
        class="flex gap-6 transition-transform duration-700 ease-out items-center"
      >
        {% for slide in include.section.slides %}
        <div
          class="min-w-[70%] md:min-w-[28%] rounded-xl overflow-hidden flex-shrink-0 group {% if forloop.index == 2 %}scale-110 shadow-2xl{% else %}scale-90 opacity-80{% endif %} transition-all duration-500"
        >
          <div class="overflow-hidden">
            <img
              src="{{ slide.image }}"
              class="w-full h-[400px] object-cover transition-transform duration-700 group-hover:scale-105"
              alt=""
            />
          </div>
        </div>
        {% endfor %}
      </div>
    </div>

    <!-- Caption + CTA - positioned below center image -->
    <div class="flex items-center justify-between mt-12 max-w-4xl mx-auto">
      <div class="flex items-center gap-6">
        <div class="w-24 h-[2px] bg-green-700"></div>
        <span id="captionText" class="text-lg opacity-0">
          {{ include.section.slides[1].caption }}
        </span>
      </div>

      <a
        href="{{ include.section.button.url }}"
        class="bg-green-800 text-white px-8 py-4 rounded-lg hover:opacity-90 transition-all duration-300 hover:shadow-lg hover:scale-105 opacity-0"
        id="bookNowBtn"
      >
        {{ include.section.button.label }}
      </a>
    </div>

    <!-- Navigation buttons -->
    <div class="flex justify-center items-center gap-4 mt-8">
      <button
        id="prevBtn"
        class="text-4xl w-12 h-12 flex items-center justify-center bg-white/80 backdrop-blur-sm rounded-full shadow-lg hover:bg-white transition-all duration-300 opacity-0"
        aria-label="Previous slide"
      >
        ‹
      </button>

      <button
        id="nextBtn"
        class="text-4xl w-12 h-12 flex items-center justify-center bg-white/80 backdrop-blur-sm rounded-full shadow-lg hover:bg-white transition-all duration-300 opacity-0"
        aria-label="Next slide"
      >
        ›
      </button>
    </div>
  </div>
</section>

<!-- GSAP Enhanced Slider -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Initialize GSAP
    const tl = gsap.timeline();

    // Animate title and description
    tl.to("#sectionTitle", {
      opacity: 1,
      y: 0,
      duration: 1,
      ease: "power3.out"
    })
    .to("#sectionDescription", {
      opacity: 1,
      y: 0,
      duration: 1,
      ease: "power3.out"
    }, "-=0.8")
    // Animate arrows at the bottom
    .to("#prevBtn, #nextBtn", {
      opacity: 1,
      scale: 1,
      duration: 0.8,
      stagger: 0.2,
      ease: "back.out(1.7)"
    }, "-=0.5")
    // Animate caption line
    .to(".w-24.h-\\[2px\\]", {
      width: "6rem",
      opacity: 1,
      duration: 0.8,
      ease: "power2.out"
    }, "-=0.3")
    // Animate caption text
    .to("#captionText", {
      opacity: 1,
      x: 0,
      duration: 0.8,
      ease: "power2.out"
    }, "-=0.6")
    // Animate book now button
    .to("#bookNowBtn", {
      opacity: 1,
      scale: 1,
      duration: 0.8,
      ease: "back.out(1.7)"
    }, "-=0.4");

    // Slider functionality
    const track = document.getElementById("bedroomTrack");
    const slides = Array.from(track.children);
    const caption = document.getElementById("captionText");

    // Get captions from data attribute or use provided slides
    const captions = {{ include.section.slides | map: "caption" | jsonify }};

    let index = 1; // Start with center image (index 1)
    let isAnimating = false;

    function updateSlider() {
      if (isAnimating) return;
      isAnimating = true;

      const slideWidth = slides[0].offsetWidth + 24; // width + gap (reduced gap)
      const containerWidth = track.parentElement.offsetWidth;
      const centerOffset = (containerWidth / 2) - (slides[index].offsetWidth / 2);
      const slidePosition = slides[index].offsetLeft;
      const translateX = slidePosition - centerOffset;

      // GSAP animation for slide transition
      gsap.to(track, {
        x: -translateX,
        duration: 0.8,
        ease: "power3.inOut",
        onComplete: () => {
          isAnimating = false;
        }
      });

      // Update scale and opacity for each slide
      slides.forEach((slide, i) => {
        if (i === index) {
          // Center slide - larger and fully opaque
          gsap.to(slide, {
            scale: 1.1,
            opacity: 1,
            duration: 0.6,
            ease: "power2.out"
          });
        } else {
          // Side slides - smaller and slightly transparent
          gsap.to(slide, {
            scale: 0.9,
            opacity: 0.8,
            duration: 0.6,
            ease: "power2.out"
          });
        }
      });

      // Animate caption change with crossfade
      gsap.to(caption, {
        opacity: 0,
        duration: 0.3,
        onComplete: () => {
          caption.textContent = captions[index];
          gsap.to(caption, {
            opacity: 1,
            duration: 0.5
          });
        }
      });

      // Animate the green line
      gsap.fromTo(".w-24.h-\\[2px\\]",
        { scaleX: 0.3, opacity: 0.5 },
        { scaleX: 1, opacity: 1, duration: 0.6, ease: "power2.out" }
      );
    }

    // Next button
    document.getElementById("nextBtn").addEventListener("click", () => {
      if (isAnimating) return;
      index = (index + 1) % slides.length;
      updateSlider();
    });

    // Previous button
    document.getElementById("prevBtn").addEventListener("click", () => {
      if (isAnimating) return;
      index = (index - 1 + slides.length) % slides.length;
      updateSlider();
    });

    // Keyboard navigation
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        document.getElementById("prevBtn").click();
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        document.getElementById("nextBtn").click();
      }
    });

    // Touch/swipe support for mobile
    let touchStartX = 0;
    let touchEndX = 0;

    track.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    });

    track.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 50) {
        // Swipe left
        document.getElementById("nextBtn").click();
      } else if (touchEndX - touchStartX > 50) {
        // Swipe right
        document.getElementById("prevBtn").click();
      }
    });

    // Auto-play (optional)
    let autoplayInterval;

    function startAutoplay() {
      autoplayInterval = setInterval(() => {
        if (!isAnimating) {
          document.getElementById("nextBtn").click();
        }
      }, 5000);
    }

    function stopAutoplay() {
      clearInterval(autoplayInterval);
    }

    // Start autoplay (uncomment if desired)
    // startAutoplay();

    // Stop autoplay on user interaction
    document.getElementById("prevBtn").addEventListener("click", stopAutoplay);
    document.getElementById("nextBtn").addEventListener("click", stopAutoplay);

    // Initialize first slide with center focus
    setTimeout(() => {
      updateSlider();
    }, 100);
  });
</script>
