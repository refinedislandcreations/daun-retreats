<!-- _includes/section-faq.html -->
<section class="py-16 md:py-20 lg:py-24 bg-[#FBF8EF]">
  <div
    class="container mx-auto px-4 sm:px-6 lg:px-8 space-y-12 md:space-y-16 lg:space-y-20"
  >
    <!-- Title with animation -->
    <h2
      class="animate-title font-serif text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl tracking-wide mb-8 md:mb-12 lg:mb-16 xl:mb-20 cormorant-garamond"
    >
      YOUR QUESTIONS ANSWERED
    </h2>

    {% for group in include.section.groups %}
    <div class="grid md:grid-cols-3 gap-8 md:gap-10 lg:gap-12">
      <!-- Left title with animation -->
      <div>
        <h3
          class="animate-title text-lg md:text-xl tracking-wide proza-libre proza-500"
        >
          {{ group.title }}
        </h3>
      </div>

      <!-- Right accordion -->
      <div class="md:col-span-2 border-t border-[#005509]/60">
        {% for item in group.items %}
        <div class="faq-item border-b border-[#005509]/60">
          <button
            class="faq-toggle w-full flex justify-between items-center py-4 md:py-5 lg:py-6 text-left"
          >
            <span class="proza-libre proza-600 text-sm sm:text-base">
              {{ item.question }}
            </span>

            <span
              class="faq-icon text-xl md:text-2xl text-[#005509] font-medium"
              >+</span
            >
          </button>

          <div
            class="faq-content overflow-hidden"
            style="max-height: 0; opacity: 0"
          >
            <div
              class="pb-4 md:pb-5 lg:pb-6 md:pr-8 lg:pr-10 text-neutral-700 leading-normal text-sm sm:text-base proza-libre proza-400"
            >
              {{ item.answer }}
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</section>


<!-- Isolated GSAP FAQ Script -->
<script>
  (function () {
    "use strict";

    // Wait for DOM and GSAP to be ready
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initFAQ);
    } else {
      initFAQ();
    }

    function initFAQ() {
      // Check if GSAP is loaded
      if (typeof gsap === "undefined") {
        console.warn("GSAP not loaded yet, retrying in 100ms...");
        setTimeout(initFAQ, 100);
        return;
      }

      const items = document.querySelectorAll(".faq-item");
      if (!items.length) return;

      // Store active timelines to prevent conflicts
      const activeTimelines = new Map();

      items.forEach((item) => {
        const btn = item.querySelector(".faq-toggle");
        const content = item.querySelector(".faq-content");
        const icon = item.querySelector(".faq-icon");
        const answerDiv = content.querySelector("div");

        // Set initial state with GSAP
        gsap.set(content, {
          maxHeight: 0,
          opacity: 0,
          padding: 0,
          margin: 0,
        });

        btn.addEventListener("click", (e) => {
          e.preventDefault();

          const isOpen =
            content._gsap?.maxHeight > 0 || content.style.maxHeight !== "0px";
          const duration = 0.4;

          // Kill any existing animation for this content
          if (activeTimelines.has(content)) {
            activeTimelines.get(content).kill();
            activeTimelines.delete(content);
          }

          if (isOpen) {
            // Close this dropdown
            const tl = gsap.timeline({
              onComplete: () => {
                activeTimelines.delete(content);
              },
            });

            tl.to(content, {
              maxHeight: 0,
              opacity: 0,
              padding: 0,
              margin: 0,
              duration: duration,
              ease: "power2.inOut",
            });

            tl.set(icon, { textContent: "+" }, 0);

            activeTimelines.set(content, tl);
          } else {
            // Close all other dropdowns first
            items.forEach((otherItem) => {
              const otherContent = otherItem.querySelector(".faq-content");
              const otherIcon = otherItem.querySelector(".faq-icon");

              if (
                otherContent !== content &&
                (otherContent._gsap?.maxHeight > 0 ||
                  otherContent.style.maxHeight !== "0px")
              ) {
                if (activeTimelines.has(otherContent)) {
                  activeTimelines.get(otherContent).kill();
                  activeTimelines.delete(otherContent);
                }

                const closeTl = gsap.timeline();
                closeTl.to(otherContent, {
                  maxHeight: 0,
                  opacity: 0,
                  padding: 0,
                  margin: 0,
                  duration: duration * 0.8,
                  ease: "power2.inOut",
                });
                closeTl.set(otherIcon, { textContent: "+" }, 0);
              }
            });

            // Open this dropdown
            const answerHeight = answerDiv.offsetHeight;

            const tl = gsap.timeline({
              onComplete: () => {
                activeTimelines.delete(content);
              },
            });

            tl.set(content, {
              maxHeight: 0,
              opacity: 0,
              padding: 0,
              margin: 0,
            });

            tl.to(content, {
              maxHeight: answerHeight + 32, // Add padding
              opacity: 1,
              padding: "0 1.5rem 1rem 0", // Adjust for responsive: pr-6 (1.5rem) + pb-4 (1rem)
              margin: 0,
              duration: duration,
              ease: "power2.out",
            });

            tl.set(icon, { textContent: "−" }, 0);

            activeTimelines.set(content, tl);
          }
        });
      });

      // Clean up on page unload
      window.addEventListener("beforeunload", () => {
        activeTimelines.forEach((tl) => tl.kill());
        activeTimelines.clear();
      });
    }
  })();
</script>

<style>

  /* FAQ transitions are handled by GSAP */
  .faq-content {
    will-change: max-height, opacity;
  }

  /* Container utility if not already defined */
  .container {
    width: 100%;
    margin-left: auto;
    margin-right: auto;
  }

  @media (min-width: 640px) {
    .container {
      max-width: 640px;
    }
  }
  @media (min-width: 768px) {
    .container {
      max-width: 768px;
    }
  }
  @media (min-width: 1024px) {
    .container {
      max-width: 1024px;
    }
  }
  @media (min-width: 1280px) {
    .container {
      max-width: 1280px;
    }
  }
</style>
