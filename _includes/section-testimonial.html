<!-- _includes/section-testimonial.html -->
<section class="py-16 md:py-20 lg:py-28 bg-[#FBF8EF] overflow-hidden">
  <!-- Wider container -->
  <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Title with animation -->
    <div class="text-center mb-8 md:mb-12 lg:mb-16">
      <h2
        class="testimonial-split-title tracking-[0.18em] text-3xl sm:text-4xl md:text-5xl lg:text-6xl text-[#000] cormorant-garamond"
        style="opacity: 0"
      >
        {{ include.section.title }}
      </h2>
    </div>

    <!-- Slider Wrapper -->
    <div class="relative px-0">
      <!-- Track Container with visible overflow -->
      <div class="overflow-hidden">
        <div id="testimonial-track" class="flex">
          {% for item in include.section.items %}
          <!-- Slide -->
          <div
            class="testimonial-slide min-w-full md:min-w-1/2 lg:min-w-1/3 px-2 sm:px-3 md:px-4"
          >
            <div
              class="h-full bg-[#FBF8EF] border border-[#005509] rounded-md p-5 sm:p-6 md:p-8 lg:p-10 shadow-lg group relative"
            >
              <!-- Quote + Villa Type -->
              <div
                class="flex items-center gap-2 sm:gap-3 mb-4 sm:mb-5 md:mb-6"
              >
                <!-- Quote Icon -->
                <div class="p-2">
                  <img
                    src="{{ '/assets/images/icons/quote-icon.png' | relative_url }}"
                    alt=""
                    class="w-5 h-5 sm:w-6 sm:h-6 md:w-7 md:h-7 lg:w-8 lg:h-8 opacity-70 shrink-0"
                    loading="lazy"
                  />
                </div>

                <!-- Decorative Line -->
                <span
                  class="h-[2px] flex-1 bg-[#005509]/40 group-hover:bg-[#005509]/60 transition-colors duration-300"
                ></span>

                <!-- Villa Name -->
                <p
                  class="proza-libre text-xs md:text-sm tracking-[0.18em] text-[#000] font-medium whitespace-nowrap"
                >
                  {{ item.villa }}
                </p>
              </div>

              <!-- Quote text -->
              <div class="mb-4 sm:mb-5 md:mb-6">
                <p
                  class="text-neutral-700 leading-relaxed text-sm sm:text-base proza-libre proza-400 whitespace-pre-line wrap-break-word"
                >
                  {{ item.quote | newline_to_br }}
                </p>
              </div>

              <!-- Footer with name -->
              <div class="mt-auto">
                <div class="flex items-center gap-3">
                  <!-- Decorative dot -->
                  <span
                    class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-[#005509] flex-shrink-0"
                  ></span>

                  <!-- Name -->
                  <p
                    class="font-semibold text-[#000] text-xs sm:text-sm md:text-base proza-libre"
                  >
                    {{ item.name }}
                  </p>
                </div>
              </div>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Title Animation Script -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Register SplitText and ScrollTrigger
    if (typeof gsap !== "undefined" && typeof SplitText !== "undefined") {
      gsap.registerPlugin(SplitText, ScrollTrigger);

      document.fonts.ready.then(() => {
        // ========== TESTIMONIAL TITLE ANIMATION ==========
        const testimonialTitle = document.querySelector(
          ".testimonial-split-title",
        );
        if (testimonialTitle) {
          gsap.set(testimonialTitle, { opacity: 1 });

          SplitText.create(testimonialTitle, {
            type: "words,lines",
            linesClass: "line",
            autoSplit: true,
            mask: "lines",
            onSplit: (self) => {
              gsap.from(self.lines, {
                scrollTrigger: {
                  trigger: testimonialTitle,
                  start: "top 80%",
                  toggleActions: "play reverse play reverse",
                },
                duration: 1.2,
                yPercent: 100,
                opacity: 0,
                stagger: 0.1,
                ease: "power2.out",
              });
            },
          });
        }

        ScrollTrigger.refresh();
      });
    }
  });
</script>

<!-- Continuous Loop Script - Isolated GSAP Implementation -->
<script>
  (function () {
    "use strict";

    // Wait for DOM and GSAP to be ready
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initTestimonialSlider);
    } else {
      initTestimonialSlider();
    }

    function initTestimonialSlider() {
      // Check if GSAP is loaded
      if (typeof gsap === "undefined") {
        console.warn("GSAP not loaded yet, retrying in 100ms...");
        setTimeout(initTestimonialSlider, 100);
        return;
      }

      const track = document.getElementById("testimonial-track");
      if (!track) return;

      const originalSlides = Array.from(track.children);
      if (originalSlides.length === 0) return;

      const slidesPerView =
        window.innerWidth >= 1024 ? 3 : window.innerWidth >= 768 ? 2 : 1;

      // Clone slides for seamless looping
      const cloneSlides = () => {
        const slides = Array.from(track.children);
        const slidesToClone = Math.min(slidesPerView, slides.length);

        // Clone first few slides and append to end
        for (let i = 0; i < slidesToClone; i++) {
          const clone = slides[i].cloneNode(true);
          track.appendChild(clone);
        }

        // Clone last few slides and prepend to beginning
        for (let i = slides.length - slidesToClone; i < slides.length; i++) {
          const clone = slides[i].cloneNode(true);
          track.insertBefore(clone, track.firstChild);
        }
      };

      cloneSlides();

      const allSlides = Array.from(track.children);
      const slideWidth = 100 / slidesPerView; // Width percentage for each slide

      // Calculate center offset for desktop (3 cards)
      const getInitialPosition = () => {
        if (slidesPerView === 3) {
          // Start with first original card centered
          const originalFirstIndex = slidesPerView; // After prepending clones
          return -(originalFirstIndex * slideWidth);
        } else {
          // For 2 or 1 cards, start at beginning
          return 0;
        }
      };

      // Set initial position
      gsap.set(track, { x: `${getInitialPosition()}%` });

      // Make all cards equal styling (no highlights)
      allSlides.forEach((slide) => {
        const card = slide.querySelector("div");
        if (card) {
          gsap.set(card, {
            scale: 1,
            opacity: 1,
            boxShadow: "0 10px 15px -3px rgba(0, 0, 0, 0.1)",
          });
        }
      });

      // Continuous scroll animation
      const startContinuousScroll = () => {
        const slideCount = allSlides.length;
        const totalWidth = slideCount * slideWidth;
        const duration = slideCount * 8; // 8 seconds per slide

        // Kill any existing animation
        if (window.__testimonialTl) {
          window.__testimonialTl.kill();
        }

        // Create infinite scroll timeline
        const scrollTl = gsap.timeline({
          repeat: -1,
          ease: "none",
          onRepeat: () => {
            // Reset position when reaching the end (seamless loop)
            gsap.set(track, { x: `${getInitialPosition()}%` });
          },
        });

        scrollTl.to(track, {
          x: `-${totalWidth - slidesPerView * slideWidth}%`,
          duration: duration,
          ease: "none",
        });

        // Store timeline globally within this scope
        window.__testimonialTl = scrollTl;
        return scrollTl;
      };

      let masterTl = startContinuousScroll();

      // Pause on hover
      track.addEventListener("mouseenter", () => {
        if (masterTl) masterTl.pause();
      });

      track.addEventListener("mouseleave", () => {
        if (masterTl) masterTl.resume();
      });

      // Handle window resize
      let resizeTimeout;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          // Kill current animation
          if (masterTl) masterTl.kill();

          // Recalculate slides per view
          const newSlidesPerView =
            window.innerWidth >= 1024 ? 3 : window.innerWidth >= 768 ? 2 : 1;

          if (newSlidesPerView !== slidesPerView) {
            // Reload page when breakpoint changes
            location.reload();
          } else {
            // Restart animation with same settings
            masterTl = startContinuousScroll();
          }
        }, 250);
      });

      // Clean up on page unload
      window.addEventListener("beforeunload", () => {
        if (window.__testimonialTl) {
          window.__testimonialTl.kill();
        }
      });
    }
  })();
</script>

<style>
  /* Animation styles for title */
  .testimonial-split-title {
    will-change: transform;
  }

  .testimonial-split-title .line {
    display: block;
    overflow: hidden;
    line-height: 1.3;
  }

  /* Container utility if not already defined */
  .container {
    width: 100%;
    margin-left: auto;
    margin-right: auto;
  }

  @media (min-width: 640px) {
    .container {
      max-width: 640px;
    }
  }
  @media (min-width: 768px) {
    .container {
      max-width: 768px;
    }
  }
  @media (min-width: 1024px) {
    .container {
      max-width: 1024px;
    }
  }
  @media (min-width: 1280px) {
    .container {
      max-width: 1280px;
    }
  }

  /* Custom card styling */
  .group {
    position: relative;
  }

  /* Hover effect */
  .group:hover .bg-\[\#005509\]\/40 {
    background-color: rgba(0, 85, 9, 0.6);
  }

  /* Ensure cards have consistent height */
  #testimonial-track > div > div {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* Desktop: Allow overflow for side cards */
  @media (min-width: 1024px) {
    .overflow-visible {
      overflow: visible !important;
    }
    .relative.px-0 {
      overflow: visible;
    }
  }

  /* Consistent card appearance */
  .testimonial-slide > div {
    transition: box-shadow 0.3s ease;
  }

  .testimonial-slide > div:hover {
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15) !important;
  }

  /* Text wrapping */
  .wrap-break-word {
    word-wrap: break-word;
    overflow-wrap: break-word;
    hyphens: auto;
  }
</style>
