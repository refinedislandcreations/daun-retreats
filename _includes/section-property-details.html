<section class="py-24 bg-[#FBF8EF]">
  <div class="max-w-6xl mx-auto px-6">
    <!-- Card -->
    <div class="border-2 border-[#005509] rounded-2xl p-10 md:p-14">
      <!-- Title -->
      <h2 class="text-3xl md:text-4xl font-semibold mb-10 proza-libre">
        {{ include.section.title }}
      </h2>

      <div class="grid md:grid-cols-2 gap-x-20 gap-y-8">
        {% for item in include.section.items %}
        <!-- Items -->
        <div class="flex items-center gap-4">
          {% if item.icon %}
          <img
            src="{{ item.icon }}"
            alt=""
            class="w-6 h-6 shrink-0"
            loading="lazy"
          />
          {% endif %}

          <span class="text-neutral-800 text-lg proza-libre">
            {{ item.text }}
          </span>
        </div>
        {% endfor %}
      </div>

      <!-- Button -->
      {% if include.section.button_text %}
      <div class="mt-8 md:mt-0 flex justify-end">
        <a
          href="{{ include.section.button_link }}"
          class="bg-[#005509] text-white px-8 py-3 rounded-md hover:opacity-90 transition font-medium proza-libre"
        >
          {{ include.section.button_text }}
        </a>
      </div>
      {% endif %}
    </div>
  </div>
</section>
