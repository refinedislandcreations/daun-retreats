<!-- _includes/section-property-details.html -->
<section class="py-24 bg-[#FBF8EF]">
  <div class="max-w-6xl mx-auto px-6">
    <!-- Card -->
    <div class="border-2 border-[#005509] rounded-2xl p-10 md:p-14">
      <!-- Title with animation -->
      <h2
        class="features-split-title text-3xl md:text-4xl font-semibold mb-10 proza-libre"
        style="opacity: 0"
      >
        {{ include.section.title }}
      </h2>

      <div class="grid md:grid-cols-2 gap-x-20 gap-y-8">
        {% for item in include.section.items %}
        <!-- Items -->
        <div class="flex items-center gap-4">
          {% if item.icon %}
          <img
            src="{{ item.icon }}"
            alt=""
            class="w-6 h-6 shrink-0"
            loading="lazy"
          />
          {% endif %}

          <span class="text-neutral-800 text-lg proza-libre">
            {{ item.text }}
          </span>
        </div>
        {% endfor %}
      </div>

      <!-- Button with hover animation -->
      {% if include.section.button_text %}
      <div class="mt-8 md:mt-0 flex justify-end">
        <a
          href="{{ include.section.button_link }}"
          class="features-button bg-[#005509] text-white px-8 py-3 rounded-md hover:opacity-90 transition font-medium proza-libre overflow-hidden inline-block"
        >
          <span>{{ include.section.button_text }}</span>
        </a>
      </div>
      {% endif %}
    </div>
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Make sure GSAP and SplitText are loaded
    if (typeof gsap === "undefined" || typeof SplitText === "undefined") {
      console.log("GSAP or SplitText not loaded yet");
      return;
    }

    document.fonts.ready.then(() => {
      // ========== FEATURES TITLE ANIMATION ==========
      const featureTitles = document.querySelectorAll(".features-split-title");

      featureTitles.forEach((title) => {
        if (title) {
          gsap.set(title, { opacity: 1 });

          SplitText.create(title, {
            type: "words,lines",
            linesClass: "line",
            autoSplit: true,
            mask: "lines",
            onSplit: (self) => {
              gsap.from(self.lines, {
                scrollTrigger: {
                  trigger: title,
                  start: "top 80%",
                  toggleActions: "play reverse play reverse",
                },
                duration: 1.2,
                yPercent: 100,
                opacity: 0,
                stagger: 0.1,
                ease: "power2.out",
              });
            },
          });
        }
      });

      // ========== FEATURES BUTTON HOVER ANIMATION ==========
      const featureButtons = gsap.utils.toArray(".features-button");
      featureButtons.forEach((btn) => {
        const span = btn.querySelector("span");
        if (span) {
          let tl = gsap.timeline({ paused: true });
          tl.to(span, {
            duration: 0.2,
            yPercent: -150,
            ease: "power2.in",
          });
          tl.set(span, { yPercent: 150 });
          tl.to(span, {
            duration: 0.2,
            yPercent: 0,
            ease: "power2.out",
          });

          btn.addEventListener("mouseenter", () => tl.play(0));
          btn.addEventListener("mouseleave", () => {
            tl.kill();
            gsap.set(span, { yPercent: 0 });
          });
        }
      });

      ScrollTrigger.refresh();
    });
  });
</script>

<style>
  /* Animation styles */
  .features-split-title * {
    will-change: transform;
  }

  .features-split-title .line {
    display: block;
    overflow: hidden;
    line-height: 1.3;
  }

  /* Button hover styles */
  .features-button {
    display: inline-block;
    overflow: hidden;
    text-decoration: none;
    text-align: center;
  }

  .features-button span {
    display: inline-block;
    will-change: transform;
  }

  /* Preserve original styles */
  .proza-libre {
    font-family: "Proza Libre", sans-serif;
  }
</style>
