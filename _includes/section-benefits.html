<!-- _includes/section-benefits.html -->
<section class="section bg-[#FBF8EF]">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Title -->
    <div class="mb-6 md:mb-8 lg:mb-10 text-center">
      <h2
        class="animate-title cormorant-garamond tracking-[0.15em] uppercase text-3xl sm:text-4xl md:text-5xl lg:text-6xl text-[#111]"
      >
        {{ include.section.title }}
      </h2>
    </div>

    <!-- Grid -->
    <div class="grid md:grid-cols-2">
      {% for item in include.section.items %}

      <div
        class="p-6 sm:p-8 md:p-10 lg:p-14 border-t border-b border-[#005509]/40 {% if forloop.first %} border-t-0 {% endif %} {% if forloop.last %} border-b-0 {% endif %} md:even:border-l md:border-[#005509]/40 {% if forloop.index0 < 2 %} md:border-t-0 {% endif %} {% if forloop.index0 > 3 %} md:border-b-0 {% endif %}"
      >
        <div class="flex items-start gap-4 md:gap-5">
          <!-- Icon -->
          <img
            src="{{ item.icon }}"
            alt="{{ item.title }}"
            class="w-6 h-6 md:w-7 md:h-7 shrink-0"
            loading="lazy"
            decoding="async"
            width="28"
            height="28"
          />

          <!-- Text -->
          <div>
            <!-- Item Title with animation -->
            <h3
              class="animate-title proza-libre text-lg font-semibold text-[#111] mb-1 md:mb-2 lg:mb-3"
            >
              {{ item.title }}
            </h3>

            <!-- Description with animation -->
            <p
              class="why-item-description proza-libre text-sm md:text-base leading-relaxed text-[#333]"
            >
              {{ item.description }}
            </p>
          </div>
        </div>
      </div>

      {% endfor %}
    </div>
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Make sure GSAP and SplitText are loaded
    if (typeof gsap === "undefined" || typeof SplitText === "undefined") {
      console.log("GSAP or SplitText not loaded yet");
      return;
    }

    document.fonts.ready.then(() => {
      // ========== ITEM DESCRIPTIONS ANIMATION ==========
      const itemDescriptions = document.querySelectorAll(
        ".why-item-description",
      );
      itemDescriptions.forEach((desc) => {
        gsap.set(desc, { opacity: 1 });

        SplitText.create(desc, {
          type: "lines",
          linesClass: "line",
          autoSplit: true,
          mask: "lines",
          onSplit: (self) => {
            gsap.from(self.lines, {
              scrollTrigger: {
                trigger: desc,
                start: "top 80%",
                toggleActions: "play reverse play reverse",
              },
              duration: 0.9,
              yPercent: 100,
              opacity: 0,
              stagger: 0.05,
              ease: "power2.out",
              delay: 0.1,
            });
          },
        });
      });

      ScrollTrigger.refresh();
    });
  });
</script>

<style>
  /* Animation styles */
  .why-item-description * {
    will-change: transform;
  }

  .why-item-description .line {
    display: block;
    overflow: hidden;
    line-height: 1.3;
  }

  /* Container utility if not already defined */
  .container {
    width: 100%;
    margin-left: auto;
    margin-right: auto;
  }

  @media (min-width: 640px) {
    .container {
      max-width: 640px;
    }
  }
  @media (min-width: 768px) {
    .container {
      max-width: 768px;
    }
  }
  @media (min-width: 1024px) {
    .container {
      max-width: 1024px;
    }
  }
  @media (min-width: 1280px) {
    .container {
      max-width: 1280px;
    }
  }

  /* Border styles remain the same */
  .border-\[\#005509\]\/40 {
    border-color: rgba(0, 85, 9, 0.4);
  }
</style>
