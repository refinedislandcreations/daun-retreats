<section class="py-24 bg-[#F1EBD8]">
  <div class="max-w-screen-2xl mx-auto px-6">
    <!-- Grid -->
    <div class="grid lg:grid-cols-3 gap-8">
      <!-- ===================== -->
      <!-- Big Left Image -->
      <!-- ===================== -->
      <div class="lg:col-span-2">
        <div class="overflow-hidden">
          <img
            src="{{ include.section.images.main }}"
            alt=""
            loading="lazy"
            class="w-full h-full object-cover aspect-[4/3] hover:scale-105 transition duration-700"
          />
        </div>
      </div>

      <!-- ===================== -->
      <!-- Right Stack -->
      <!-- ===================== -->
      <div class="flex flex-col gap-8">
        <div class="overflow-hidden">
          <img
            src="{{ include.section.images.side_top }}"
            alt=""
            loading="lazy"
            class="w-full object-cover aspect-[4/3] hover:scale-105 transition duration-700"
          />
        </div>

        <div class="overflow-hidden">
          <img
            src="{{ include.section.images.side_bottom }}"
            alt=""
            loading="lazy"
            class="w-full object-cover aspect-[4/3] hover:scale-105 transition duration-700"
          />
        </div>
      </div>
    </div>
  </div>
</section>
