<!-- _includes/section-welcome.html -->
<section class="relative py-28 overflow-hidden bg-[#FBF8EF]">
  <!-- ================= BACKGROUND IMAGE ================= -->
  <div class="absolute inset-0 max-w-screen-2xl mx-auto">
    <img
      src="{{ include.section.background }}"
      alt=""
      class="w-full h-full object-cover"
      loading="lazy"
    />
  </div>

  <!-- ================= CONTENT ================= -->
  <div class="relative mx-auto px-6 z-10 py-16">
    <div class="max-w-screen-2xl mx-auto lg:px-16">
      <!-- Soft cream overlay -->
      <div
        class="absolute inset-0 -z-10 bg-[#FBF8EF]/90 backdrop-blur-[1px]"
      ></div>

      <!-- Title -->
      <h2
        class="text-center font-serif tracking-[0.2em] text-4xl md:text-5xl lg:text-6xl text-[#000] mb-20 cormorant-garamond"
      >
        {{ include.section.title }}
      </h2>

      <!-- Cards grid -->
      <div class="grid md:grid-cols-3 gap-8 lg:gap-10 mb-20">
        {% for item in include.section.items %}
        <a href="{{ item.link }}" class="group block">
          <div
            class="overflow-hidden shadow-md hover:shadow-xl transition-shadow duration-300"
          >
            <img
              src="{{ item.image }}"
              alt="{{ item.title }}"
              class="w-full aspect-square object-cover transition duration-700 group-hover:scale-105"
              loading="lazy"
            />
          </div>

          <!-- Caption-->
          <div class="mt-5 flex items-center justify-end gap-3">
            <span
              class="h-[2px] w-[30%] md:w-[20%] lg:w-[40%] bg-[#005509]/60 transition-all duration-300"
            ></span>
            <p
              class="text-sm md:text-base tracking-wide text-[#000] proza-libre proza-500"
            >
              {{ item.title }}
            </p>
          </div>
        </a>
        {% endfor %}
      </div>

      <!-- Description -->
      <div class="max-w-4xl mx-auto text-center">
        <p
          class="text-[#000]/80 leading-relaxed text-base md:text-lg lg:text-xl proza-libre proza-400"
        >
          {{ include.section.description }}
        </p>
      </div>
    </div>
  </div>
</section>

<style>
  /* Ensure consistent font rendering */
  .cormorant-garamond {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.03);
  }

  .proza-libre {
    font-family: "Proza Libre", sans-serif;
  }

  .proza-400 {
    font-weight: 400;
  }

  .proza-500 {
    font-weight: 500;
  }

  /* Smooth hover transitions */
  .group:hover .bg-\[\#005509\]\/60 {
    background-color: rgba(0, 85, 9, 0.8);
  }

  /* Better image handling */
  .aspect-square img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Ensure overlay only covers content area */
  .relative.max-w-7xl {
    position: relative;
  }

  .absolute.inset-0.-z-10 {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Allows clicking through to links */
  }
</style>
