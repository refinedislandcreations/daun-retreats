<!-- _includes/section-cta.html -->
<section
  class="section-cta relative overflow-hidden bg-[#FBF8EF] bg-center"
  style="
    background-image: url('{{ include.section.background }}');
    background-size: cover;
    background-position: top center;
  "
>
  <!-- ================= CONTENT ================= -->
  <div class="relative z-10 py-12 md:py-16 lg:py-20">
    <!-- Full-width CTA Background -->
    <div class="w-full text-center bg-[#FBF8EF]/80 py-12 md:py-16">
      <!-- Title with animation -->
      <div
        class="cta-split-title max-w-6xl mx-auto tracking-[0.2em] text-3xl sm:text-4xl md:text-5xl lg:text-6xl text-[#000] cormorant-garamond whitespace-pre-line uppercase mb-8 md:mb-10 lg:mb-12"
        style="opacity: 0"
      >
        {{ include.section.title | raw }}
      </div>

      <!-- Button with hover animation -->
      <a
        href="{{ include.section.button_link }}"
        class="cta-button inline-block bg-[#005509] hover:bg-[#0c6a13] text-white px-6 md:px-8 py-2.5 md:py-3 rounded-md text-sm md:text-base tracking-wide proza-libre proza-500 transition duration-300 overflow-hidden"
      >
        <span>{{ include.section.button_text }}</span>
      </a>
    </div>
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (typeof gsap === "undefined" || typeof SplitText === "undefined") return;

    document.fonts.ready.then(() => {
      // CTA Title Animation
      const ctaTitles = document.querySelectorAll(".cta-split-title");
      ctaTitles.forEach((ctaTitle) => {
        if (!ctaTitle) return;
        gsap.set(ctaTitle, { opacity: 1 });
        SplitText.create(ctaTitle, {
          type: "words,lines",
          linesClass: "line",
          autoSplit: true,
          mask: "lines",
          onSplit: (self) => {
            gsap.from(self.lines, {
              scrollTrigger: {
                trigger: ctaTitle,
                start: "top 80%",
                toggleActions: "play reverse play reverse",
              },
              duration: 1.2,
              yPercent: 100,
              opacity: 0,
              stagger: 0.1,
              ease: "power2.out",
            });
          },
        });
      });

      // CTA Button Hover Animation
      const ctaButtons = gsap.utils.toArray(".cta-button");
      ctaButtons.forEach((btn) => {
        const span = btn.querySelector("span");
        if (!span) return;
        let tl = gsap.timeline({ paused: true });
        tl.to(span, { duration: 0.2, yPercent: -150, ease: "power2.in" });
        tl.set(span, { yPercent: 150 });
        tl.to(span, { duration: 0.2, yPercent: 0, ease: "power2.out" });

        btn.addEventListener("mouseenter", () => tl.play(0));
        btn.addEventListener("mouseleave", () => {
          tl.kill();
          gsap.set(span, { yPercent: 0 });
        });
      });

      ScrollTrigger.refresh();
    });
  });
</script>

<style>
  /* Animation styles */
  .cta-split-title * {
    will-change: transform;
  }
  .cta-split-title .line {
    display: block;
    overflow: hidden;
    line-height: 1.3;
  }

  /* Button hover styles */
  .cta-button {
    display: inline-block;
    overflow: hidden;
    text-decoration: none;
    text-align: center;
  }
  .cta-button span {
    display: inline-block;
    will-change: transform;
  }

  /* ================= Section-CTA Specific Height Fix ================= */
  .section-cta {
    min-height: auto;
  }
  @media (max-width: 640px) {
    .section-cta {
      max-height: 500px;
      background-size: cover;
    }
  }
</style>
