<!-- _includes/section-contact-form.html -->
<section class="py-16 md:py-20 lg:py-24 xl:py-28 bg-[#E9E6DC]">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <!-- ================= Title with animation ================= -->
    <h2
      class="contact-split-title cormorant-garamond text-3xl sm:text-4xl md:text-5xl lg:text-6xl tracking-[0.12em] mb-8 md:mb-10 lg:mb-12"
      style="opacity: 0"
    >
      {{ include.section.title }}
    </h2>

    <!-- Main Grid -->
    <div
      class="grid md:grid-cols-2 gap-8 md:gap-12 lg:gap-16 xl:gap-20 items-start"
    >
      <!-- LEFT : FORM -->
      <form
        action="{{ include.section.form.action | default:'#' }}"
        method="POST"
        class="space-y-5 md:space-y-6"
      >
        <!-- Name -->
        <div class="group">
          <label
            class="block proza-libre mb-1.5 md:mb-2 text-sm md:text-base font-medium text-neutral-700 group-focus-within:text-green-800 transition"
          >
            Your Name <span class="text-green-800">*</span>
          </label>

          <input
            type="text"
            name="name"
            required
            placeholder="John Doe"
            class="w-full proza-libre border-2 border-green-800/30 rounded-lg px-4 md:px-5 py-3 md:py-4 bg-[#FBF8EF] backdrop-blur-sm focus:bg-[#FFF]/80 focus:border-green-800 focus:outline-none focus:ring-4 focus:ring-green-800/10 transition-all duration-300 text-sm md:text-base"
          />
        </div>

        <!-- Email -->
        <div class="group">
          <label
            class="block proza-libre mb-1.5 md:mb-2 text-sm md:text-base font-medium text-neutral-700 group-focus-within:text-green-800 transition"
          >
            Your E-Mail <span class="text-green-800">*</span>
          </label>

          <input
            type="email"
            name="email"
            required
            placeholder="hello@example.com"
            class="w-full border-2 border-green-800/30 rounded-lg px-4 md:px-5 py-3 md:py-4 bg-[#FBF8EF] backdrop-blur-sm focus:bg-[#FFF]/80 focus:border-green-800 focus:outline-none focus:ring-4 focus:ring-green-800/10 transition-all duration-300 text-sm md:text-base"
          />
        </div>

        <!-- Property Select -->
        <div class="group">
          <label
            class="block proza-libre mb-1.5 md:mb-2 text-sm md:text-base font-medium text-neutral-700 group-focus-within:text-green-800 transition"
          >
            Which property are you enquiring about?
            <span class="text-green-800">*</span>
          </label>

          <div class="relative">
            <select
              name="property"
              required
              class="w-full proza-libre border-2 border-green-800/30 rounded-lg px-4 md:px-5 py-3 md:py-4 bg-[#FBF8EF] backdrop-blur-sm focus:bg-[#FFF]/80 focus:border-green-800 focus:outline-none focus:ring-4 focus:ring-green-800/10 transition-all duration-300 appearance-none cursor-pointer text-sm md:text-base"
            >
              <option value="" disabled selected>
                Choose your villa or select "Other"
              </option>

              {% for option in include.section.form.properties %}
              <option value="{{ option | slugify }}">{{ option }}</option>
              {% endfor %}
            </select>

            <!-- Custom Arrow -->
            <div
              class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 md:px-5 text-green-800"
            >
              <svg
                class="w-4 h-4 md:w-5 md:h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </div>
          </div>
        </div>

        <!-- Message -->
        <div class="group">
          <label
            class="block mb-1.5 md:mb-2 text-sm md:text-base font-medium text-neutral-700 group-focus-within:text-green-800 transition"
          >
            Message <span class="text-green-800">*</span>
          </label>

          <textarea
            rows="5"
            name="message"
            required
            placeholder="Tell us about your inquiry..."
            class="w-full proza-libre border-2 border-green-800/30 rounded-lg px-4 md:px-5 py-3 md:py-4 bg-[#FBF8EF] backdrop-blur-sm focus:bg-[#FFF]/80 focus:border-green-800 focus:outline-none focus:ring-4 focus:ring-green-800/10 transition-all duration-300 resize-none text-sm md:text-base"
          ></textarea>
        </div>

        <!-- Button with hover animation -->
        <div class="flex justify-end pt-2 md:pt-4">
          <button
            type="submit"
            class="contact-button group relative !bg-[#005509] !text-[#FBF8EF] px-5 md:px-6 py-2.5 md:py-4 rounded-lg hover:!bg-[#005509]/80 transition-all duration-300 flex items-center gap-3 proza-libre overflow-hidden text-sm md:text-base"
          >
            <span>{{ include.section.form.button }}</span>
          </button>
        </div>
      </form>

      <!-- RIGHT : IMAGE -->
      <div class="space-y-4 md:space-y-5 lg:space-y-6">
        <img
          src="{{ include.section.image }}"
          alt=""
          class="w-full h-[280px] sm:h-[360px] md:h-[420px] lg:h-[480px] xl:h-[520px] object-cover rounded-lg shadow-md"
          loading="lazy"
        />

        {% if include.section.caption %}
        <div
          class="flex items-center justify-end gap-3 md:gap-4 text-xs md:text-sm"
        >
          <div
            class="flex-1 h-[1px] bg-black/40 max-w-[8rem] md:max-w-[10rem] lg:max-w-[12rem]"
          ></div>
          <span class="whitespace-nowrap"> {{ include.section.caption }} </span>
        </div>
        {% endif %}
      </div>
    </div>

    <!-- ===================================================== -->
    <!-- Bottom Info -->
    <!-- ===================================================== -->
    <div
      class="grid md:grid-cols-2 gap-8 md:gap-12 lg:gap-16 xl:gap-20 mt-12 md:mt-16 lg:mt-20 xl:mt-24"
    >
      <!-- Contact Details -->
      <div class="proza-libre">
        <h3 class="font-medium mb-2 md:mb-3 lg:mb-4 text-base md:text-lg">
          Contact Details
        </h3>
        <p class="text-sm md:text-base">{{ include.section.details.email }}</p>
        <p class="text-sm md:text-base">{{ include.section.details.phone }}</p>
      </div>

      <!-- Socials -->
      <div>
        <h3
          class="font-medium mb-2 md:mb-3 lg:mb-4 proza-libre text-base md:text-lg"
        >
          Follow Us
        </h3>

        <div class="flex gap-4 md:gap-5 lg:gap-6 items-center">
          {% for s in include.section.socials %}
          <a
            href="{{ s.url }}"
            target="_blank"
            class="hover:opacity-70 transition"
          >
            <img
              src="{{ s.icon }}"
              class="w-5 h-5 md:w-6 md:h-6 lg:w-7 lg:h-7 object-contain"
              alt=""
            />
          </a>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Make sure GSAP and SplitText are loaded
    if (typeof gsap === "undefined" || typeof SplitText === "undefined") {
      console.log("GSAP or SplitText not loaded yet");
      return;
    }

    document.fonts.ready.then(() => {
      // ========== CONTACT TITLE ANIMATION ==========
      const contactTitles = document.querySelectorAll(".contact-split-title");

      contactTitles.forEach((title) => {
        if (title) {
          gsap.set(title, { opacity: 1 });

          SplitText.create(title, {
            type: "words,lines",
            linesClass: "line",
            autoSplit: true,
            mask: "lines",
            onSplit: (self) => {
              gsap.from(self.lines, {
                scrollTrigger: {
                  trigger: title,
                  start: "top 80%",
                  toggleActions: "play reverse play reverse",
                },
                duration: 1.2,
                yPercent: 100,
                opacity: 0,
                stagger: 0.1,
                ease: "power2.out",
              });
            },
          });
        }
      });

      // ========== CONTACT BUTTON HOVER ANIMATION ==========
      const contactButtons = gsap.utils.toArray(".contact-button");
      contactButtons.forEach((btn) => {
        const span = btn.querySelector("span");
        if (span) {
          let tl = gsap.timeline({ paused: true });
          tl.to(span, {
            duration: 0.2,
            yPercent: -150,
            ease: "power2.in",
          });
          tl.set(span, { yPercent: 150 });
          tl.to(span, {
            duration: 0.2,
            yPercent: 0,
            ease: "power2.out",
          });

          btn.addEventListener("mouseenter", () => tl.play(0));
          btn.addEventListener("mouseleave", () => {
            tl.kill();
            gsap.set(span, { yPercent: 0 });
          });
        }
      });

      ScrollTrigger.refresh();
    });
  });
</script>

<style>
  /* Animation styles */
  .contact-split-title * {
    will-change: transform;
  }

  .contact-split-title .line {
    display: block;
    overflow: hidden;
    line-height: 1.3;
  }

  /* Container utility if not already defined */
  .container {
    width: 100%;
    margin-left: auto;
    margin-right: auto;
  }

  @media (min-width: 640px) {
    .container {
      max-width: 640px;
    }
  }
  @media (min-width: 768px) {
    .container {
      max-width: 768px;
    }
  }
  @media (min-width: 1024px) {
    .container {
      max-width: 1024px;
    }
  }
  @media (min-width: 1280px) {
    .container {
      max-width: 1280px;
    }
  }
  @media (min-width: 1536px) {
    .container {
      max-width: 1536px;
    }
  }

  /* Button hover styles */
  .contact-button {
    display: inline-block;
    overflow: hidden;
    text-decoration: none;
    text-align: center;
  }

  .contact-button span {
    display: inline-block;
    will-change: transform;
  }

  /* Form input focus styles */
  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
  }
</style>
